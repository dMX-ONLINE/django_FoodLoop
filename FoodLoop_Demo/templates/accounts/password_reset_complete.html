{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed | FoodLoop</title>

    <link rel="stylesheet" href="{% static 'css/password_reset.css' %}">
</head>

<body>

<section class="auth-page4">
    <div class="auth-container4">

        <div class="auth-card4">

            <div class="auth-header4">

                <div class="auth-header-icon">
                    ✓
                </div>

                <h1>Password Changed!</h1>

                <p>
                    Your FoodLoop password has been updated successfully.
                    You can now log in using your new password.
                </p>

            </div>

            <a href="{% url 'accounts:login' %}" class="auth-submit">
                Login Now
            </a>

        </div>

    </div>
</section>

</body>
</html>
